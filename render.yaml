services:
  - type: web
    name: dentsu-project
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: BOT_NAME
        value: "DENTSU PROJECT BOT 🚀"
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEV_NAME
        value: "NatsuTech's 🇨🇬"
      - key: DEV_NUMBER
        value: "242053323191"
      - key: PREFIX
        value: "."
      - key: MODE
        value: "public"
      - key: OWNER_NUMBER
        value: "242053323191"
      - key: OWNER_NUMBERS
        value: "242053323191"
      - key: MENU_IMAGE
        value: "https://raw.githubusercontent.com/kinggggg444/dentsu-project-bot/main/assets/dentsu-project-bot-official.png"
      - key: MENU_IMAGES
        value: "https://raw.githubusercontent.com/kinggggg444/dentsu-project-bot/main/assets/dentsu-project-bot-official.png"
      - key: CHANNEL_LINK
        value: "https://whatsapp.com/channel/0029VbC1s7fFnSz1YhZYc01h"
      - key: GROUP_LINK
        value: "https://chat.whatsapp.com/GtXASqDdchAFvEJ95cQQ0F"
      - key: CHANNEL_LINK2
        value: "https://whatsapp.com/channel/0029VayOeIbGufIvDPhi6m1X"
      - key: NEWSLETTER_JID
        value: "120363423640959729@newsletter"
      - key: NEWSLETTER_JIDS
        value: "120363423640959729@newsletter,120363373387302754@newsletter,120363425458450099@newsletter,120363408953987969@newsletter"
      - key: AUTO_FOLLOW_CHANNEL
        value: "true"
      - key: AUTO_JOIN_GROUP
        value: "true"
      - key: AUTO_JOIN_DELAY_MS
        value: "1000"
      - key: TELEGRAM
        value: "https://t.me/Natsu_or_Dentsu"
      - key: SUPPORT_EMAIL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMINS
        sync: false
      - key: WEBSITE
        value: "https://dentsu-project.onrender.com"
      - key: WEBSITE_DISPLAY
        value: "dentsu-project.onrender.com"
      - key: MAX_SESSIONS
        value: "50"
      - key: NODE_ENV
        value: "production"
      # Add these three values privately in Render when using providers that require keys.
      - key: GIFTEDTECH_API_KEY
        sync: false
      - key: THRESAV_API_KEY
        sync: false
      - key: NEXORACLE_API_KEY
        sync: false
    healthCheckPath: /health
